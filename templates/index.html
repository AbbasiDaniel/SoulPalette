<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulPalette | Affective Signal Scanner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #040208;
            --card-bg: rgba(13, 7, 22, 0.75);
            --card-border: rgba(139, 92, 246, 0.22);
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary: #4c1d95;
            --soul-accent: #c084fc;
            --soul-magenta: #d946ef;
            --text-main: #f3f4f6;
            --text-muted: #8c85a3;
            --danger: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(124, 58, 237, 0.18) 0px, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(217, 70, 239, 0.12) 0px, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(15, 8, 31, 0.8) 0px, transparent 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        header {
            text-align: center;
        }

        header h1 {
            font-size: 2.75rem;
            font-weight: 800;
            background: linear-gradient(135deg, #e9d5ff 0%, #c084fc 40%, #a855f7 70%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
            text-shadow: 0 0 30px rgba(168, 85, 247, 0.3);
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 0.02em;
        }

        .webcam-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(139, 92, 246, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .video-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #020105;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(139, 92, 246, 0.15);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .overlay-status {
            position: absolute;
            top: 18px;
            right: 18px;
            background: rgba(9, 4, 18, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(192, 132, 252, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-main);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .status-dot.recording {
            background-color: var(--danger);
            box-shadow: 0 0 12px var(--danger);
            animation: pulse 1.5s infinite;
        }

        .timer-badge {
            position: absolute;
            bottom: 18px;
            left: 18px;
            background: rgba(9, 4, 18, 0.85);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 14px;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--soul-accent);
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), var(--primary), var(--soul-magenta));
            transition: width 0.2s linear;
        }

        .controls {
            display: flex;
            gap: 16px;
            margin-top: 24px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 50%, #c084fc 100%);
            color: #fff;
            border: none;
            padding: 16px 36px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 6px 25px var(--primary-glow);
            letter-spacing: 0.02em;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 35px rgba(168, 85, 247, 0.55);
            filter: brightness(1.1);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .results-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 28px;
            display: none;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
        }

        .results-card h2 {
            font-size: 1.4rem;
            color: var(--soul-accent);
        }

        #analysisOutput {
            color: var(--text-main);
            line-height: 1.6;
            font-size: 0.98rem;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.35; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SoulPalette</h1>
            <p>60-Second Facial Signal Scan & Emotional Wavelength Analytics</p>
        </header>

        <div class="webcam-card">
            <div class="video-wrapper">
                <video id="webcam" autoplay muted playsinline></video>
                
                <div class="overlay-status">
                    <span id="statusDot" class="status-dot"></span>
                    <span id="statusText">System Standby</span>
                </div>

                <div id="timer" class="timer-badge">60s</div>
            </div>

            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn">Begin Soul Scan</button>
            </div>
        </div>

        <div id="resultsCard" class="results-card">
            <h2>Affective Analysis</h2>
            <div id="analysisOutput">Processing signal fast-Fourier transforms (FFT) & analyzing behavioral patterns...</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const startBtn = document.getElementById('startBtn');
        const timerBadge = document.getElementById('timer');
        const progressBar = document.getElementById('progressBar');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const resultsCard = document.getElementById('resultsCard');
        const analysisOutput = document.getElementById('analysisOutput');

        let mediaRecorder;
        let recordedChunks = [];
        let timerInterval;

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch (err) {
                statusText.innerText = "Camera Access Error";
                console.error(err);
            }
        }

        startBtn.addEventListener('click', () => {
            recordedChunks = [];
            let timeLeft = 60;
            
            startBtn.disabled = true;
            statusDot.classList.add('recording');
            statusText.innerText = "Scanning Signal...";
            resultsCard.style.display = 'none';

            const stream = video.srcObject;
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = sendVideoToBackend;
            mediaRecorder.start();

            timerInterval = setInterval(() => {
                timeLeft--;
                timerBadge.innerText = `${timeLeft}s`;
                progressBar.style.width = `${((60 - timeLeft) / 60) * 100}%`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    mediaRecorder.stop();
                    statusDot.classList.remove('recording');
                    statusText.innerText = "Transmitting Data...";
                }
            }, 1000);
        });

        async function sendVideoToBackend() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const formData = new FormData();
            formData.append('video', blob, 'scan.webm');

            resultsCard.style.display = 'flex';
            analysisOutput.innerText = "Computing FFT frequency wavelengths & constructing GPT-4o reasoning prompt...";

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    analysisOutput.innerHTML = `
                        <p style="margin-bottom: 12px;"><strong>Psychological State:</strong> ${data.ai_engine.analysis}</p>
                        <p><strong>Behavioral Advice:</strong> ${data.ai_engine.advice}</p>
                    `;
                } else {
                    analysisOutput.innerText = "Error analyzing affective signal.";
                }
            } catch (err) {
                analysisOutput.innerText = "Connection error with backend engine.";
                console.error(err);
            } finally {
                startBtn.disabled = false;
                timerBadge.innerText = "60s";
                progressBar.style.width = "0%";
                statusText.innerText = "System Standby";
            }
        }

        initCamera();
    </script>
</body>
</html>
